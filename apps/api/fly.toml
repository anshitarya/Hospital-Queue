# Fly.io config for the NestJS API.
# App name must be globally unique — change "hq-api" to something like "yourname-hq-api".
app    = "turnos-api-hq"
primary_region = "bom"   # Mumbai — keep API near Redis + users

[build]
  dockerfile = "Dockerfile.prod"

[env]
  PORT                        = "4000"
  NODE_ENV                    = "production"
  OTP_DEV_MODE                = "true"
  DEFAULT_AVG_CONSULT_MINUTES = "7"
  JWT_EXPIRES_IN              = "30d"
  OTP_TTL_SECONDS             = "300"
  WALKIN_GAP                  = "4"
  MISSED_GAP                  = "4"
  FOLLOWUP_EVERY              = "0"
  CORS_ORIGIN                 = "https://turnos.fly.dev,https://turnos-hq.fly.dev"
  # Single API machine — skip Socket.IO Redis pub/sub (saves Upstash commands).
  # Set to "true" only when min_machines_running > 1.
  SOCKET_IO_REDIS_ADAPTER     = "false"
  # ── Notification feature flags (flip to "true" when ready) ──────────────────
  FEATURE_SMS                 = "false"   # flip after MSG91 secrets are set
  FEATURE_WHATSAPP            = "false"   # flip after Meta WA secrets are set
  # MSG91_AUTH_KEY, MSG91_SENDER_ID         → set via: fly secrets set
  # META_WA_ACCESS_TOKEN, META_WA_PHONE_NUMBER_ID → set via: fly secrets set
  # META_WA_USE_TEMPLATES                   = "false"  (change to "true" after templates approved)

# DATABASE_URL and REDIS_URL are set as secrets by the deploy script.
# JWT_SECRET and CORS_ORIGIN are also set as secrets.

# Migrations only — seed is idempotent but not compiled to dist/; run manually if needed:
#   flyctl ssh console -a turnos-api-hq -C "npx ts-node prisma/seed.ts"
[deploy]
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port       = 4000
  force_https         = true
  auto_stop_machines  = false   # keep alive — WebSocket connections need this
  auto_start_machines = true
  min_machines_running = 1   # 1 machine is enough — WebSockets + SOCKET_IO_REDIS_ADAPTER=false

  # Allow WebSocket upgrades (Socket.IO)
  [http_service.concurrency]
    type       = "connections"
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    grace_period = "15s"
    interval     = "10s"
    method       = "GET"
    timeout      = "5s"
    path         = "/api/health"

[[vm]]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 1024
