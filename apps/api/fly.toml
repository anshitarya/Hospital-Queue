# Fly.io config for the NestJS API.
# App name must be globally unique — change "hq-api" to something like "yourname-hq-api".
app    = "queue-hq-api"
region = "bom"       # Mumbai — closest to India

[build]
  dockerfile = "Dockerfile.prod"

[env]
  PORT                        = "4000"
  NODE_ENV                    = "production"
  OTP_DEV_MODE                = "true"
  DEFAULT_AVG_CONSULT_MINUTES = "7"
  JWT_EXPIRES_IN              = "30d"
  OTP_TTL_SECONDS             = "300"
  WALKIN_GAP                  = "4"
  MISSED_GAP                  = "4"
  FOLLOWUP_EVERY              = "0"
  CORS_ORIGIN                 = "https://clinicqueue.fly.dev"
  FEATURE_WHATSAPP            = "false"
  FEATURE_SMS                 = "false"

# DATABASE_URL and REDIS_URL are set as secrets by the deploy script.
# JWT_SECRET and CORS_ORIGIN are also set as secrets.

# release_command runs once before traffic switches to the new machines.
# It has full access to secrets and the image filesystem.
[deploy]
  release_command = "npx prisma migrate deploy && node dist/prisma/seed.js"

[http_service]
  internal_port       = 4000
  force_https         = true
  auto_stop_machines  = false   # keep alive — WebSocket connections need this
  auto_start_machines = true
  min_machines_running = 1

  # Allow WebSocket upgrades (Socket.IO)
  [http_service.concurrency]
    type       = "connections"
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    grace_period = "15s"
    interval     = "10s"
    method       = "GET"
    timeout      = "5s"
    path         = "/api/health"

[[vm]]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 1024
