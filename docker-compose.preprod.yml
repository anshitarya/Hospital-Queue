version: "3.9"

# ─── Pre-production local stack ───────────────────────────────────────────────
#
# Purpose: run the PRODUCTION build locally before pushing to Fly.io.
# Uses Dockerfile.prod (multi-stage, optimised) instead of the dev Dockerfile.
# No hot-reload. No source-code volumes. Mirrors the Fly.io runtime closely.
#
# Usage:
#   cp .env.preprod.example .env.preprod
#   # fill in JWT_SECRET at minimum
#   docker compose -f docker-compose.preprod.yml --env-file .env.preprod up --build
#
# Ports (different from dev to avoid clashes if both stacks run side-by-side):
#   PostgreSQL  → localhost:5433
#   Redis       → localhost:6380
#   API         → localhost:4001  (http://localhost:4001/api/health)
#   Web         → localhost:3001  (http://localhost:3001)
#
# Key differences from docker-compose.yml (dev):
#   • Uses Dockerfile.prod (compiled, no ts-node, no tsx --watch)
#   • NODE_ENV = production
#   • No source-code bind-mounts → a code change requires `--build`
#   • OTP_DEV_MODE = true so OTPs still log to console (no real SMS)
#   • Feature flags off by default (no real SMS/WA charges)

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - hq_pgdata_preprod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - hq_redisdata_preprod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
      args:
        INSECURE_SSL: ${INSECURE_SSL:-0}
    restart: unless-stopped
    environment:
      NODE_ENV:                    production
      DATABASE_URL:                postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL:                   redis://redis:6379
      JWT_SECRET:                  ${JWT_SECRET}
      JWT_EXPIRES_IN:              ${JWT_EXPIRES_IN:-30d}
      OTP_TTL_SECONDS:             ${OTP_TTL_SECONDS:-300}
      OTP_DEV_MODE:                ${OTP_DEV_MODE:-true}
      DEFAULT_AVG_CONSULT_MINUTES: ${DEFAULT_AVG_CONSULT_MINUTES:-7}
      CORS_ORIGIN:                 http://localhost:3001
      # ── Feature flags ─────────────────────────────────────────────────────
      FEATURE_SMS:                 ${FEATURE_SMS:-false}
      FEATURE_WHATSAPP:            ${FEATURE_WHATSAPP:-false}
      # ── Notification providers (fill in .env.preprod to test) ────────────
      MSG91_AUTH_KEY:              ${MSG91_AUTH_KEY:-}
      MSG91_SENDER_ID:             ${MSG91_SENDER_ID:-TURNOS}
      META_WA_ACCESS_TOKEN:        ${META_WA_ACCESS_TOKEN:-}
      META_WA_PHONE_NUMBER_ID:     ${META_WA_PHONE_NUMBER_ID:-}
      META_WA_USE_TEMPLATES:       ${META_WA_USE_TEMPLATES:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4001:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        INSECURE_SSL:          ${INSECURE_SSL:-0}
        NEXT_PUBLIC_API_URL:   http://localhost:4001
        NEXT_PUBLIC_SOCKET_URL: http://localhost:4001
    restart: unless-stopped
    environment:
      NODE_ENV:            production
      SUPER_ADMIN_LOCKED:  ${SUPER_ADMIN_LOCKED:-false}
      SUPER_ADMIN_HOST:    ${SUPER_ADMIN_HOST:-admin.turnos.com}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3000"

volumes:
  hq_pgdata_preprod:
  hq_redisdata_preprod:
